<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>NEON SKETCH PRO — Draw &amp; Guess</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid"></div></div>
<div class="scanlines"></div>
<canvas id="fx"></canvas>
<button id="btnSound" class="icon-btn sound-fab" title="Sound on/off" aria-label="Sound">🔊</button>

<noscript><p class="noscript">JavaScript must be enabled to play this game.</p></noscript>

<section id="home" class="screen">
  <div class="card glass">
    <h1 class="logo">NEON<span>SKETCH</span><small>PRO</small></h1>
    <p class="tag">Draw · Guess · Dominate</p>

    <label class="field">
      <span>YOUR NAME</span>
      <input id="name" maxlength="14" placeholder="e.g. NeonFox" autocomplete="off" autocapitalize="words">
    </label>

    <button id="btnCreate" class="btn btn-primary">＋ CREATE ROOM</button>

    <div class="or"><span>OR JOIN A ROOM</span></div>

    <div class="join-row">
      <input id="code" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="0000" autocomplete="off">
      <button id="btnJoin" class="btn">JOIN</button>
    </div>
    <div id="homeErr" class="err"></div>
  </div>
</section>

<section id="lobby" class="screen hidden">
  <div class="card glass wide pink">
    <p class="tag">ROOM CODE</p>
    <div id="roomCode" class="code-display">----</div>
    <button id="btnCopy" class="btn btn-ghost">🔗 COPY INVITE LINK</button>

    <h3 class="section-title">PLAYERS</h3>
    <ul id="lobbyPlayers" class="plist"></ul>

    <div id="hostBox" class="settings hidden">
      <label>ROUNDS
        <select id="setRounds"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>8</option></select>
      </label>
      <label>DRAW TIME (SEC)
        <select id="setTime"><option>30</option><option selected>60</option><option>90</option><option>120</option></select>
      </label>
      <button id="btnStart" class="btn btn-primary">▶ START GAME</button>
    </div>
    <p id="waitMsg" class="muted">Host will start the game…</p>
    <div id="lobbyErr" class="err"></div>
    <button id="btnLeaveLobby" class="btn btn-ghost danger-btn">LEAVE ROOM</button>
  </div>
</section>

<section id="game" class="screen hidden">
  <header class="topbar glass">
    <div id="roundInfo" class="round-info">ROUND 1/3</div>
    <div class="wordwrap">
      <div id="wordBox" class="word">…</div>
      <div id="wordMeta" class="wmeta"></div>
    </div>
    <div id="timer" class="timer">--</div>
    <button id="btnLeave" class="icon-btn danger" title="Leave room" aria-label="Leave">✕</button>
  </header>
  <div class="timebar"><i id="timeFill"></i></div>

  <main class="layout">
    <aside class="panel glass players-panel">
      <h3>LEADERBOARD</h3>
      <ul id="board" class="plist"></ul>
    </aside>

    <section class="board-col">
      <div id="status" class="status"></div>
      <div class="canvas-wrap"><canvas id="cv" class="locked"></canvas></div>

      <div id="tools" class="tools glass hidden">
        <div id="swatches" class="swatches"></div>
        <div class="size-row">
          <span id="brushDot" class="brush-dot"></span>
          <input id="size" type="range" min="2" max="40" value="8" aria-label="Brush size">
        </div>
        <div class="tool-row">
          <button id="btnEraser" class="tool-btn" title="Eraser">🧽</button>
          <button id="btnUndo" class="tool-btn" title="Undo (Ctrl+Z)">↶</button>
          <button id="btnRedo" class="tool-btn" title="Redo (Ctrl+Y)">↷</button>
          <button id="btnClear" class="tool-btn" title="Clear">🗑</button>
        </div>
      </div>
    </section>

    <aside class="panel glass chat-panel">
      <h3>GUESS CHAT</h3>
      <div id="msgs" class="msgs"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatIn" maxlength="120" placeholder="Type your guess…" autocomplete="off" enterkeyhint="send">
        <button type="submit" aria-label="Send">➤</button>
      </form>
    </aside>
  </main>
</section>

<div id="overlay" class="overlay hidden"><div id="ovBox" class="overlay-card glass"></div></div>
<div id="toasts" class="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
